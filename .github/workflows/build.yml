name: Build Turnip

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the release"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [standard, a8xx, perf]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git ccache ninja-build python3-pip pkg-config \
            libdrm-dev libxcb1-dev libxcb-dri3-dev libxcb-present-dev \
            libxcb-randr0-dev libxcb-shm0-dev libx11-xcb-dev \
            libxshmfence-dev \
            flex bison glslang-tools zstd tar
          pip3 install --break-system-packages "meson>=1.4" mako

      - name: Build variant ${{ matrix.variant }}
        env:
          VARIANT: ${{ matrix.variant }}
          BUILD_VERSION: ${{ github.run_number }}
        run: |
          chmod +x build_turnip.sh
          ./build_turnip.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: turnip-${{ matrix.variant }}
          path: /tmp/turnip-*.tzst
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.publish == 'true' || github.event_name == 'schedule' }}
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: turnip-*
          merge-multiple: true
          path: ./artifacts

      - name: List artifacts
        run: ls -la ./artifacts/

      - name: Upload to components repo
        env:
          GH_TOKEN: ${{ secrets.COMPONENTS_PAT }}
        run: |
          for f in ./artifacts/*.tzst; do
            echo "Uploading $f..."
            gh release upload turnip "$f" \
              --repo mihsian77/winlator-components \
              --clobber || echo "Warning: failed to upload $f"
          done

      - name: Update index.txt
        env:
          GH_TOKEN: ${{ secrets.COMPONENTS_PAT }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/mihsian77/winlator-components.git
          cd winlator-components
          
          echo "# Turnip Drivers" > turnip/index.txt
          echo "" >> turnip/index.txt
          echo "Available versions:" >> turnip/index.txt
          echo "" >> turnip/index.txt
          
          gh release view turnip --repo mihsian77/winlator-components --json assets \
            --jq '.assets[].name' | sort >> turnip/index.txt
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add turnip/index.txt
          git diff --staged --quiet || git commit -m "chore: update turnip component list"
          git push
