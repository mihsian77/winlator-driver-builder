name: Build Turnip

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the release"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [standard, a8xx, perf]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          # Enable deb-src sources for apt build-dep (Ubuntu 24.04 uses DEB822 format)
          echo "deb-src http://archive.ubuntu.com/ubuntu/ noble main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          echo "deb-src http://archive.ubuntu.com/ubuntu/ noble-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          sudo apt-get update -qq
          sudo apt build-dep -y mesa
          sudo apt-get install -y --no-install-recommends \
            git ccache ninja-build python3-pip pkg-config \
            libxfixes-dev libarchive-dev \
            libdrm-dev libxcb-dri3-dev libxcb-present-dev libxcb-sync-dev \
            flex bison glslang-tools zstd tar patchelf
          pip3 install --break-system-packages "meson>=1.4" mako

      - name: Build variant ${{ matrix.variant }}
        env:
          VARIANT: ${{ matrix.variant }}
          BUILD_VERSION: ${{ github.run_number }}
        run: |
          chmod +x build_turnip.sh
          ./build_turnip.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: turnip-${{ matrix.variant }}
          path: /tmp/turnip-*.tzst
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.publish != 'false' }}
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: turnip-*
          merge-multiple: true
          path: ./artifacts

      - name: List artifacts
        run: ls -la ./artifacts/

      - name: Upload to components repo
        env:
          GH_TOKEN: ${{ secrets.COMPONENTS_PAT }}
        run: |
          FAILED=0
          for f in ./artifacts/*.tzst; do
            echo "Uploading $f..."
            gh release upload turnip "$f" \
              --repo mihsian77/winlator-components \
              --clobber || { echo "::error::upload failed: $f"; FAILED=$((FAILED+1)); }
          done
          # 以前这里把失败吞成 warning，导致 job 显示成功但组件仓库里根本没有新文件
          [ "$FAILED" -eq 0 ]

      - name: Update index.txt
        env:
          GH_TOKEN: ${{ secrets.COMPONENTS_PAT }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/mihsian77/winlator-components.git
          cd winlator-components

          # Plain filename list only: the installer parses every line as a
          # downloadable asset, so title/blank lines become junk entries.
          # 自编译产物带 -dev，不进公开列表（仍可从 release 手动下载）
          LIST=$(gh release view turnip --repo mihsian77/winlator-components --json assets \
            --jq '.assets[].name')
          if [ -n "$LIST" ]; then
            echo "$LIST" | grep -v -- '-dev' | sort > turnip/index.txt || true
          fi
          
          git config user.name "mihsian77"
          git config user.email "209595350+mihsian77@users.noreply.github.com"
          git add turnip/index.txt
          git diff --staged --quiet || git commit -m "chore: update turnip component list"
          git push
